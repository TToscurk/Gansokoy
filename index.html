<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>博麗神社 — Hakurei Shrine 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0d18;
    font-family: "Noto Sans TC","Yu Gothic","Meiryo",system-ui,sans-serif; }
  canvas { display:block; }

  /* cross/help/place/prompt/toast 的樣式在 src/ui/hud.js（全地圖共用） */
  #saisen { position:absolute; right:20px; bottom:16px; color:#ffd9a0; font-size:12px;
    letter-spacing:.1em; text-shadow:0 1px 4px #000; opacity:.8; }

  #veil { position:fixed; inset:0; z-index:20; display:flex; align-items:center;
    justify-content:center; cursor:pointer;
    background:radial-gradient(ellipse at 50% 42%, #2a1f2e 0%, #120d18 62%, #07060c 100%); }
  #veil.hide { opacity:0; pointer-events:none; transition:opacity .55s ease; }
  #card { text-align:center; color:#f3ece4; user-select:none; }
  #card .kanji { font-size:min(11vw,68px); letter-spacing:.34em; font-weight:600;
    text-indent:.34em; text-shadow:0 0 26px rgba(255,120,90,.35); }
  #card .rom { margin-top:10px; font-size:12px; letter-spacing:.5em; opacity:.55; text-indent:.5em; }
  #card .rule { width:180px; height:1px; margin:26px auto; background:linear-gradient(90deg,transparent,#c8563f,transparent); }
  #card .go { font-size:15px; letter-spacing:.18em; opacity:.9; }
  #card .go span { color:#ff9d7a; }
  #card .keys { margin-top:16px; font-size:11.5px; letter-spacing:.14em; opacity:.45; line-height:2; }
  #card .warn { margin-top:22px; font-size:10.5px; letter-spacing:.1em; opacity:.3; }
  #veil .torii { position:absolute; inset:0; opacity:.07; pointer-events:none; }
  #loading { position:fixed; left:50%; bottom:8%; transform:translateX(-50%); z-index:21;
    color:#f3ece4; font-size:12px; letter-spacing:.3em; opacity:.5; }

  /* 對話框 */
  #talk { position:fixed; left:50%; bottom:52px; transform:translate(-50%,26px);
    width:min(880px,90vw); z-index:40; opacity:0; pointer-events:none;
    transition:opacity .26s ease, transform .26s ease; }
  #talk.on { opacity:1; transform:translate(-50%,0); }
  #talk .box { background:linear-gradient(180deg,rgba(24,18,28,.96),rgba(14,10,18,.97));
    border:1px solid rgba(217,178,106,.42); border-radius:4px; padding:22px 28px 20px;
    box-shadow:0 24px 70px rgba(0,0,0,.75); }
  #talk .who { display:flex; align-items:center; gap:11px; margin-bottom:13px; }
  #talk .who .dot { width:11px; height:11px; border-radius:50%; }
  #talk .who .n { font-size:16px; font-weight:800; letter-spacing:.13em; color:#f3ece4; }
  #talk .who .r { font-size:10px; color:#8d7f94; letter-spacing:.2em; }
  #talk .line { font-size:16px; line-height:2.1; color:#eadfe6; min-height:3.4em; letter-spacing:.03em; }
  #talk .next { text-align:right; font-size:11px; color:#8d7f94; letter-spacing:.16em; margin-top:12px; }
  #talk .next b { color:#d9b26a; }
  /* 對話中把準心和提示藏起來 */
  body.talking #cross, body.talking #prompt { opacity:0 !important; }

  /* 任務日誌（class 名稱對齊 src/ui/questlog.js） */
  #questLog { position:fixed; left:18px; top:76px; width:308px; z-index:35;
    background:linear-gradient(180deg,rgba(24,18,28,.94),rgba(14,10,18,.96));
    border:1px solid rgba(217,178,106,.34); border-radius:4px; padding:16px 18px;
    opacity:0; pointer-events:none; transform:translateX(-12px);
    transition:opacity .2s ease, transform .2s ease;
    max-height:60vh; overflow-y:auto; }
  #questLog.on { opacity:1; transform:translateX(0); }
  #questLog h3 { font-size:12px; letter-spacing:.28em; color:#d9b26a;
    margin-bottom:13px; font-weight:700; }
  #questLog .q { margin-bottom:14px; }
  #questLog .qt { font-size:12.5px; font-weight:700; color:#f3ece4; letter-spacing:.05em; }
  #questLog .main-badge { color:#e0725a; font-size:9px; margin-right:6px; letter-spacing:.12em; }
  #questLog .qo { font-size:11px; color:#b3a6ba; line-height:1.75; margin-top:5px; }
  #questLog .empty { font-size:11px; color:#8d7f94; line-height:1.9; }
  #questLog .doneHead { font-size:10px; letter-spacing:.2em; color:#6f6478; margin:12px 0 7px;
    border-top:1px solid rgba(255,255,255,.08); padding-top:10px; }
  #questLog .qdone { font-size:10.5px; color:#6f6478; line-height:1.9; }

  /* 角色場景編輯器 */
  #sceneEditor { position:fixed; right:18px; top:76px; width:250px; z-index:37;
    background:linear-gradient(180deg,rgba(24,18,28,.94),rgba(14,10,18,.96));
    border:1px solid rgba(217,178,106,.34); border-radius:4px; padding:14px 16px;
    opacity:0; pointer-events:none; transform:translateX(12px);
    transition:opacity .2s ease, transform .2s ease;
    max-height:70vh; overflow-y:auto; }
  #sceneEditor.on { opacity:1; pointer-events:auto; transform:translateX(0); }
  #sceneEditor h3 { font-size:12px; letter-spacing:.28em; color:#d9b26a;
    margin-bottom:8px; font-weight:700; }
  #sceneEditor .ehint { font-size:10px; color:#a99cb0; line-height:1.6; margin-bottom:12px; }
  #sceneEditor .esel { color:#d9b26a; }
  #sceneEditor .eempty { font-size:11px; color:#8d7f94; line-height:1.9; }
  #sceneEditor .epalette { display:flex; flex-wrap:wrap; gap:8px; }
  .ecard { width:64px; padding:8px 4px 7px; border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.04); cursor:grab; text-align:center; border-radius:3px;
    transition:.15s; }
  .ecard:hover { background:rgba(194,56,47,.2); border-color:#c2382f; }
  .ecard:active { cursor:grabbing; }
  .ecard .eswatch { width:26px; height:26px; border-radius:50%; margin:0 auto 6px;
    border:2px solid rgba(255,255,255,.3); }
  .ecard .enm { font-size:10.5px; font-weight:700; color:#f3ece4; letter-spacing:.02em;
    line-height:1.3; pointer-events:none; }

  /* 任務通知 */
  #questToasts { position:fixed; right:18px; top:96px; z-index:36;
    display:flex; flex-direction:column; gap:7px; align-items:flex-end; }
  .qtoast { font-size:12px; letter-spacing:.07em; padding:8px 15px; border-radius:3px;
    background:rgba(20,14,24,.92); border-left:2px solid #8d7f94; color:#eadfe6;
    opacity:0; transform:translateX(14px); transition:opacity .3s ease, transform .3s ease;
    white-space:nowrap; box-shadow:0 8px 26px rgba(0,0,0,.6); }
  .qtoast.on { opacity:1; transform:translateX(0); }
  .qtoast.start { border-left-color:#d9b26a; }
  .qtoast.done { border-left-color:#7fc08a; }
  .qtoast.update { border-left-color:#e0725a; }

  /* 角色選擇卡片 */
  #charCards { display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
    margin-top:22px; max-width:760px; }
  .ccard { width:104px; padding:12px 8px 12px; border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.04); cursor:pointer; text-align:center;
    border-radius:3px; transition:.18s; }
  .ccard:hover, .ccard:focus-visible { background:rgba(194,56,47,.25); border-color:#c2382f;
    transform:translateY(-3px); outline:none; }
  .cswatch { width:40px; height:40px; border-radius:50%; margin:0 auto 9px;
    border:2px solid rgba(255,255,255,.3); }
  .cnm { font-size:13px; font-weight:700; letter-spacing:.04em; color:#f3ece4; }
  .crm { font-size:8px; letter-spacing:.1em; color:#8d7f94; margin-top:3px; }
  .cds { font-size:9px; color:#a99cb0; margin-top:7px; line-height:1.55; min-height:42px; }
  /* 數值列：移動力長條 + 能力標籤 */
  .cbar { height:3px; background:rgba(255,255,255,.14); border-radius:2px;
    margin:9px 4px 6px; overflow:hidden; }
  .cbar i { display:block; height:100%; background:#e0725a; }
  .ctags { display:flex; gap:4px; justify-content:center; flex-wrap:wrap; }
  .ctag { font-size:8px; letter-spacing:.06em; padding:2px 5px; border-radius:2px;
    background:rgba(255,255,255,.09); color:#c9bcd0; }
  .ctag.fly { background:rgba(110,160,235,.22); color:#bcd4f5; }
  .ctag.jump { background:rgba(226,168,90,.2); color:#f0d3a4; }
</style>
</head>
<body>
<div id="loading">建立中…</div>

<!-- 共用 HUD（cross/place/prompt/toast/help/戰鬥/ESC/讀取）由 src/ui/hud.js 注入 -->
<div id="questToasts"></div>
<div id="saisen">賽錢 ¥<span id="yen">0</span></div>

<div id="talk">
  <div class="box">
    <div class="who"><div class="dot"></div><div class="n"></div><div class="r"></div></div>
    <div class="line"></div>
    <div class="next"><b>E</b> 繼續</div>
  </div>
</div>

<div id="questLog">
  <h3>任 務</h3>
  <div class="body"></div>
</div>


<div id="sceneEditor">
  <h3>場景編輯</h3>
  <div class="ehint">拖曳角色到場景中放置；把已放置的角色拖回這裡收回。</div>
  <div class="ehint esel">點一下場上的角色即可選取並旋轉</div>
  <div class="epalette"></div>
</div>

<div id="veil">
  <svg class="torii" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
    <g fill="#ff8a6b"><rect x="8" y="26" width="84" height="5" rx="2"/>
    <rect x="14" y="38" width="72" height="4"/><rect x="22" y="26" width="7" height="60"/>
    <rect x="71" y="26" width="7" height="60"/><rect x="47" y="31" width="6" height="8"/></g>
  </svg>
  <div id="card">
    <div class="kanji">博麗神社</div>
    <div class="rom">HAKUREI JINJA</div>
    <div class="rule"></div>
    <div class="go">選擇角色 <span>開始參拜</span></div>
    <div id="charCards"></div>
    <div class="warn">同人創作 / 非官方 · fan-made, unofficial</div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.min.js",
  "three/addons/": "./vendor/jsm/"
} }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
