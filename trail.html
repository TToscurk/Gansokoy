<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>獸道 — 博麗神社 ⇄ 人間之里</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#101408;
    font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; color:#f3ece4; }
  canvas { display:block; }

  #title { position:fixed; top:22px; right:26px; z-index:30; text-align:right;
    pointer-events:none; text-shadow:0 2px 10px rgba(0,0,0,.7); }
  #title h1 { font-size:26px; letter-spacing:.42em; font-weight:800; color:#e8f0d8; }
  #title .sub { font-size:11px; letter-spacing:.3em; color:#9ab080; margin-top:4px; }

  #prompt { position:fixed; left:50%; bottom:16%; transform:translateX(-50%);
    z-index:30; padding:9px 22px; font-size:14px; letter-spacing:.14em;
    background:rgba(12,16,8,.72); border:1px solid rgba(200,220,160,.35);
    border-radius:3px; opacity:0; transition:opacity .25s; pointer-events:none; }
  #prompt.on { opacity:1; }

  #toast { position:fixed; left:50%; top:20%; transform:translateX(-50%);
    z-index:31; padding:10px 26px; font-size:14px; letter-spacing:.1em;
    background:rgba(12,16,8,.8); border:1px solid rgba(200,220,160,.4);
    border-radius:3px; opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.on { opacity:1; }

  #hint { position:fixed; left:26px; bottom:20px; z-index:30; font-size:12px;
    line-height:2; color:#c8d4b0; text-shadow:0 1px 6px rgba(0,0,0,.8); pointer-events:none; }
  #hint b { color:#f0e6c8; }

  #loading { position:fixed; inset:0; z-index:50; display:flex; align-items:center;
    justify-content:center; background:#101408; font-size:14px; letter-spacing:.4em; color:#9ab080; }

  /* 戰鬥 HUD（與 index.html 同一套，src/combat/hud.js 共用） */
  #formBanner{position:fixed;top:22%;left:50%;transform:translateX(-50%);z-index:55;
    font-size:30px;font-weight:800;letter-spacing:.22em;pointer-events:none;opacity:0;
    color:#ffb050;text-shadow:0 0 18px rgba(255,122,26,.85),0 0 40px rgba(58,122,255,.5),0 2px 6px rgba(0,0,0,.7)}
  #formBanner.on{animation:formFlash .9s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes formFlash{
    0%{opacity:0;transform:translateX(-50%) scale(1.35)}
    14%{opacity:1;transform:translateX(-50%) scale(1)}
    70%{opacity:1}
    100%{opacity:0;transform:translateX(-50%) scale(.96)}}
  #combo{position:fixed;top:26%;right:5%;z-index:55;pointer-events:none;opacity:0;
    transition:opacity .35s;text-align:right;color:#ffd9a0;
    text-shadow:0 0 14px rgba(255,122,26,.7),0 2px 5px rgba(0,0,0,.7)}
  #combo.on{opacity:1}
  #combo .n{display:block;font-size:44px;font-weight:800;line-height:1}
  #combo .u{display:block;font-size:12px;letter-spacing:.4em;margin-top:4px;color:#c9a2c8}
  #combo.tick .n{animation:comboTick .22s ease-out}
  @keyframes comboTick{0%{transform:scale(1.28)}100%{transform:scale(1)}}
  #charge{position:fixed;bottom:16%;left:50%;transform:translateX(-50%);z-index:55;
    width:220px;height:5px;border-radius:3px;pointer-events:none;opacity:0;
    background:rgba(12,10,16,.62);box-shadow:0 0 0 1px rgba(255,176,80,.28);
    transition:opacity .18s}
  #charge.on{opacity:1}
  #charge .f{height:100%;width:0;border-radius:3px;
    background:linear-gradient(90deg,#ff7a1a,#3a7aff);
    box-shadow:0 0 12px rgba(255,122,26,.8)}
  #charge .lb{position:absolute;top:-20px;left:0;width:100%;text-align:center;
    font-size:11px;letter-spacing:.34em;color:#ffc689;opacity:0;
    text-shadow:0 0 10px rgba(255,122,26,.8)}
  #charge.full .lb{opacity:1}
  #charge.full .f{animation:chargeFull .5s ease-out infinite alternate}
  @keyframes chargeFull{0%{filter:brightness(1)}100%{filter:brightness(1.9)}}
</style>
</head>
<body>
<div id="loading">獸 道 生 成 中 …</div>
<div id="title"><h1>獸　道</h1><div class="sub">BEAST TRAIL · 博麗神社 ⇄ 人間之里</div>
  <div class="sub" id="lvlBadge" style="margin-top:6px;color:#d8c890"></div></div>
<div id="prompt"></div>
<div id="toast"></div>
<div id="hint">
  <div><b>WASD</b> 移動　<b>Shift</b> 疾走　<b>Space</b> 跳躍　<b>F</b> 飛行</div>
  <div><b>E</b> 互動　<span id="combatHelp" style="display:none"><b>左鍵</b> 出招　<b>R</b> 拔刀/納刀　</span><b>滑鼠</b> 視角（點擊畫面鎖定）</div>
</div>
<div id="formBanner"></div>
<div id="combo"><span class="n">0</span><span class="u">連擊</span></div>
<div id="charge"><div class="lb">日之呼吸・全型</div><div class="f"></div></div>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.min.js",
  "three/addons/": "./vendor/jsm/"
} }
</script>
<script type="module" src="./trail.js"></script>
</body>
</html>
